<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Market Predictor</title>
    <link rel="stylesheet" href="../static/style.css">

</head>
<body>

    <div>
        <h1>AI BASED STOCK ASSISTANT</h1>
    </div>

    <div class="container">
        <form method="POST" action="/predict" enctype="multipart/form-data">
            
            <label for="lastdata">Enter last 10 days price of the stock</label><br><br>

            <input type="file" name="lastdata" id="lastdata" required><br><br>

            <div class="button">
                <button type="submit">Predict</button>
            </div>

        </form>
    </div>

</body>
</html>
